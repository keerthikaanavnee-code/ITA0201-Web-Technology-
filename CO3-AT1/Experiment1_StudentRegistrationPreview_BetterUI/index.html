<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Preview</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #172033;
            background:
                radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.25), transparent 30%),
                radial-gradient(circle at 85% 80%, rgba(14, 165, 233, 0.22), transparent 30%),
                linear-gradient(135deg, #eef2ff, #f8fafc 50%, #e0f2fe);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 35px 18px;
        }

        .app {
            width: min(1050px, 100%);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .card {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 22px 60px rgba(30, 41, 59, 0.14);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 28px;
        }

        .logo {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            font-size: 25px;
            background: linear-gradient(135deg, #6366f1, #06b6d4);
            color: white;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.28);
        }

        h1 {
            margin: 0;
            font-size: 26px;
        }

        .subtitle {
            margin: 5px 0 0;
            color: #64748b;
            font-size: 14px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #334155;
        }

        input, select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #dbe2ea;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.85);
            color: #172033;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        input:focus, select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
        }

        .primary-btn {
            width: 100%;
            border: none;
            border-radius: 13px;
            padding: 14px;
            margin-top: 5px;
            color: white;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            box-shadow: 0 10px 22px rgba(79, 70, 229, 0.25);
            transition: 0.2s;
        }

        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(79, 70, 229, 0.32);
        }

        .preview-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .preview-title h2 {
            margin: 0;
            font-size: 20px;
        }

        .status {
            font-size: 12px;
            padding: 6px 10px;
            border-radius: 999px;
            background: #ecfdf5;
            color: #059669;
            font-weight: 700;
        }

        .empty {
            min-height: 390px;
            border: 2px dashed #dbe2ea;
            border-radius: 18px;
            display: grid;
            place-items: center;
            text-align: center;
            padding: 30px;
            color: #94a3b8;
        }

        .empty-icon {
            font-size: 45px;
            margin-bottom: 10px;
        }

        .empty h3 {
            color: #475569;
            margin: 0 0 6px;
        }

        .empty p {
            margin: 0;
            font-size: 13px;
        }

        .profile {
            animation: showProfile 0.35s ease;
            border-radius: 18px;
            overflow: hidden;
            background: white;
            border: 1px solid #e2e8f0;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
        }

        .profile-header {
            padding: 22px;
            color: white;
            background: linear-gradient(135deg, #6366f1, #06b6d4);
        }

        .avatar {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: rgba(255, 255, 255, 0.2);
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .profile-header h3 {
            margin: 0;
            font-size: 21px;
        }

        .profile-header p {
            margin: 5px 0 0;
            opacity: 0.85;
            font-size: 13px;
        }

        .details {
            padding: 20px 22px;
        }

        .detail {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px solid #eef2f7;
            font-size: 14px;
        }

        .detail:last-child {
            border-bottom: none;
        }

        .detail span:first-child {
            color: #64748b;
        }

        .detail span:last-child {
            font-weight: 700;
            text-align: right;
        }

        .remove-btn {
            width: calc(100% - 44px);
            margin: 0 22px 22px;
            padding: 12px;
            border: 1px solid #fecaca;
            border-radius: 11px;
            background: #fff5f5;
            color: #dc2626;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .remove-btn:hover {
            background: #fee2e2;
        }

        @keyframes showProfile {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 800px) {
            .app {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <section class="card">
        <div class="brand">
            <div class="logo">🎓</div>
            <div>
                <h1>Student Registration</h1>
                <p class="subtitle">Enter your details to create a profile preview</p>
            </div>
        </div>

        <div class="field">
            <label for="name">FULL NAME</label>
            <input type="text" id="name" placeholder="Enter your full name">
        </div>

        <div class="field">
            <label for="regno">REGISTER NUMBER</label>
            <input type="text" id="regno" placeholder="e.g. 24IT101">
        </div>

        <div class="field">
            <label for="department">DEPARTMENT</label>
            <input type="text" id="department" placeholder="e.g. Information Technology">
        </div>

        <div class="field">
            <label for="year">YEAR OF STUDY</label>
            <select id="year">
                <option value="">Select your year</option>
                <option value="1st Year">1st Year</option>
                <option value="2nd Year">2nd Year</option>
                <option value="3rd Year">3rd Year</option>
                <option value="4th Year">4th Year</option>
            </select>
        </div>

        <button class="primary-btn" id="displayBtn">✨ Generate Profile Preview</button>
    </section>

    <section class="card">
        <div class="preview-title">
            <h2>Profile Preview</h2>
            <span class="status">LIVE PREVIEW</span>
        </div>

        <div id="profileContainer">
            <div class="empty" id="emptyState">
                <div>
                    <div class="empty-icon">👤</div>
                    <h3>No profile yet</h3>
                    <p>Fill in the form and click<br>“Generate Profile Preview”.</p>
                </div>
            </div>
        </div>
    </section>

</div>

<script src="script.js"></script>
</body>
</html>
