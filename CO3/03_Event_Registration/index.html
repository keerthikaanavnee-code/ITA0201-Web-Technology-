<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Campus Event Registration</title><link rel="stylesheet" href="style.css"></head>
<body><div class="page">
<header><span class="tag">CAMPUS EVENTS</span><h1>Register for an Event</h1><p>Interactive JavaScript event-handling demonstration.</p></header>
<main><section class="events"><div class="event active" data-event="Tech Workshop"><b>01</b><h3>Tech Workshop</h3><p>Hands-on web development session.</p></div><div class="event" data-event="Hackathon"><b>02</b><h3>Hackathon</h3><p>Build, solve and present your idea.</p></div><div class="event" data-event="Design Meetup"><b>03</b><h3>Design Meetup</h3><p>Explore UI, art and creative design.</p></div></section>
<section class="card"><h2>Registration Form</h2><form id="form"><label>Name<input id="name" required placeholder="Your name"></label><label>Email<input id="email" type="email" required placeholder="you@example.com"></label><label>Selected Event<input id="selected" readonly value="Tech Workshop"></label><button type="submit">Complete Registration</button></form><div id="message"></div></section></main></div><script src="script.js"></script></body></html>
