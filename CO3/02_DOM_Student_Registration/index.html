<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Student Registration Manager</title><link rel="stylesheet" href="style.css"></head>
<body><div class="wrap">
<header><div><span class="eyebrow">DOM APPLICATION</span><h1>Student Registration Manager</h1><p>Add, display, remove and clear student records dynamically.</p></div><div class="count" id="count">0<br><small>Students</small></div></header>
<section class="panel form-panel"><h2>Add Student</h2><div class="form-grid"><input id="name" placeholder="Student Name"><input id="reg" placeholder="Register Number"><input id="dept" placeholder="Department"><button id="addBtn">Add Student</button></div><p id="message"></p></section>
<section class="panel"><div class="section-head"><h2>Registered Students</h2><div><button class="secondary" id="removeBtn">Remove Last</button><button class="danger" id="clearBtn">Clear All</button></div></div><div id="empty">No student records yet. Add the first student above.</div><div id="studentList"></div></section>
</div><script src="script.js"></script></body></html>
