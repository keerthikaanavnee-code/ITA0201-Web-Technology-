<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Compatibility Lab</title><link rel="stylesheet" href="style.css"></head>
<body><div class="wrap">
<header><span class="tag">FEATURE DETECTION LAB</span><h1>Cross-Browser Compatibility</h1><p>Check browser support and provide fallbacks instead of assuming features exist.</p></header>
<section class="hero"><div><h2>Compatibility Score</h2><div class="score" id="score">0%</div><p id="summary">Checking browser features...</p></div><div class="shield">✓</div></section>
<section class="checks" id="checks"></section>
<section class="fallback"><h2>Fallback Demonstration</h2><p id="fallbackText"></p><button id="storageBtn">Test Local Storage</button><button id="gridBtn">Test CSS Grid</button></section>
</div><script src="script.js"></script></body></html>
